spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shopping_cart_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

feign:
  client:
    config:
      warehouse:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic
  circuitbreaker:
    enabled: false

logging:
  level:
    ru.yandex.practicum.commerce.client: DEBUG
    org.springframework.cloud.openfeign: DEBUG