spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/commerce
  profiles:
    active: native

server:
  port: 8888

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true
    health-check-url-path: /actuator/health  # ← добавить
    status-page-url-path: /actuator/info      # ← добавить

management:
  endpoints:
    web:
      exposure:
        include: health,info  # ← добавить
  endpoint:
    health:
      show-details: always     # ← добавить

logging:
  level:
    org.springframework.cloud.config: DEBUG
    org.springframework.jdbc: DEBUG