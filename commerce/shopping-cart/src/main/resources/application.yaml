spring:
  application:
    name: shopping-cart
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        serviceId: config-server
      fail-fast: true
      retry:
        useRandomPolicy: true
        max-interval: 6000

server:
  port: 0

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

feign:
  client:
    config:
      warehouse:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full

logging:
  level:
    ru.yandex.practicum.commerce: DEBUG
    org.springframework.cloud.openfeign: DEBUG